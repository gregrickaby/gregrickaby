name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check

  # The Playwright image tag must match the installed @playwright/test, so read it from the lockfile.
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (Playwright)
    needs: playwright-version
    runs-on: ubuntu-latest
    # Chromium and its system libraries ship in the image, so the job never touches apt.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the image has this Playwright's Chromium
        run: |
          node -e "
            const { existsSync } = require('node:fs')
            const { chromium } = require('playwright-core')
            if (!existsSync(chromium.executablePath())) {
              console.error('::error::The Playwright image has no Chromium for the installed @playwright/test. Its tag and package-lock.json disagree.')
              process.exit(1)
            }
          "
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/content/**', 'next.config.ts') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # playwright.config.ts builds and starts the app; no secrets are needed.
      - run: npm run test:e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
